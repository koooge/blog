baseurl = "https://koooge.com/"
theme = "@koooge/hugo-theme-geppaku"
defaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false

googleAnalytics = "G-6HEH3C6TMZ" # Optional
disqusShortname = "koooge" # Optional
enableRobotsTXT = true

[services.rss]
    limit = 15

[languages]
  [languages.ja]
    title = "ワナビーエンジニアのブログ"
    locale = "ja-JP"
    label = "Japanese"
    weight = 1
  [languages.en]
    title = "Wannabe engineer's blog"
    locale = "en-US"
    label = "English"
    weight = 2

[markup.highlight]
  guessSyntax = true

[params.author]
    # If you want to display author information set these
    # This is Optional values
    name = "koooge"

    socials = [
        { service = "x_twitter", id = "koooge" },
        { service = "github", id = "koooge" },
        { service = "linkedin", id = "takuma-koge-888936146" },
        { service = "bluesky", id = "koooge.bsky.social" },
        { service = "slideshare", id = "koooge" },
    ]

[params]
    sharebuttons = ["x_twitter", "hatena", "bluesky"]

    [params.adsense]
        # If you want to display Google adsense set these
        # This is Optional values
        # 1. Create file written of the adsense tag into the directory "layouts/partials"
        # 2. Please set file path name omitted "layouts/partials"
        sidebar = "adsense/sidebar.html"
        content = "adsense/content.html"
